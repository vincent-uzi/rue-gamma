<!DOCTYPE html>
<html lang='fr'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
  <title>FLO</title>
  <link rel='icon' type='image/png' sizes='32x32' href='icons/favicon-32.png'>
  <link rel='apple-touch-icon' sizes='180x180' href='icons/apple-touch-icon.png'>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #1F9D55;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* HEADER : FLO + baseline */
    .splash-header {
      padding: 48px 32px 0;
      flex-shrink: 0;
    }

    .splash-title {
      font-size: 56px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .splash-baseline {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* CHARGEMENT */
    .splash-loading {
      padding: 48px 32px 0;
      flex-shrink: 0;
    }

    .loading-label {
      font-size: 15px;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 16px;
    }

    .loading-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      margin: 0 2px;
      animation: dotPulse 1.2s infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .splash-phrase {
      font-size: 22px;
      font-weight: 600;
      color: white;
      min-height: 32px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .splash-phrase.visible {
      opacity: 1;
    }

    /* LOGO EN BAS */
    .splash-logo-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .splash-logo {
      width: 100%;
      max-width: 480px;
      display: block;
      margin-bottom: -40px;
    }

    /* Fade out global */
    body.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>

  <div class='splash-header'>
    <div class='splash-title'>FLO</div>
    <div class='splash-baseline'>Front de Libération des Objets</div>
  </div>

  <div class='splash-loading'>
    <div class='loading-label'>
      Chargement
      <span class='loading-dots'>
        <span></span>
        <span></span>
        <span></span>
      </span>
    </div>
    <div class='splash-phrase' id='splash-phrase'></div>
  </div>

  <div class='splash-logo-wrap'>
    <img src='icons/visuel.png' class='splash-logo' alt='FLO'>
  </div>

  <script>
    const phrases = [
      'Un frigidaire',
      'Un joli scooter',
      'Un atomixer',
      'Et du Dunlopillo',
      'Une cuisinière',
      'Avec un four en verre',
      'Des tas de couverts',
      'Et des pelles à gâteaux'
    ];

    let phraseIndex = 0;
    const phraseEl = document.getElementById('splash-phrase');

    function showNextPhrase() {
      // Fade out
      phraseEl.classList.remove('visible');

      setTimeout(() => {
        phraseEl.textContent = phrases[phraseIndex % phrases.length];
        phraseIndex++;
        // Fade in
        phraseEl.classList.add('visible');
      }, 400);
    }

    // Démarrer les phrases
    showNextPhrase();
    const phraseInterval = setInterval(showNextPhrase, 800);

    // Redirect désactivé — splash figé
    // setTimeout(() => {
    //   clearInterval(phraseInterval);
    //   document.body.classList.add('fade-out');
    //   setTimeout(() => {
    //     window.location.href = 'index.html';
    //   }, 500);
    // }, 3500);
  </script>

</body>
</html>
