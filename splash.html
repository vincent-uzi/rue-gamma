<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F9D55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FLO</title>
<style>
  :root{
    --green:#1F9D55;
    --green-bright:#2DBB69;
    --green-deep:#198044;
    --white:#FFFFFF;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(125% 95% at 50% 36%,
        var(--green-bright) 0%,
        var(--green) 52%,
        var(--green-deep) 100%);
    color:var(--white);
    font-family:-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(30px, 6vh, 52px);
    padding:
      calc(env(safe-area-inset-top) + 24px)
      calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 24px)
      calc(env(safe-area-inset-left) + 24px);
    transition:opacity .45s ease, transform .45s ease;
  }
  .stage.out{ opacity:0; transform:scale(1.012); }

  /* ── Marque + wordmark ── */
  .brand{
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(20px, 3.6vh, 32px);
  }
  .logo{
    height:clamp(96px, 16vh, 150px);
    width:auto; display:block;
    filter:drop-shadow(0 10px 26px rgba(13,60,35,.22));
    opacity:0; transform:translateY(8px) scale(.97);
    animation:logoIn .9s cubic-bezier(.2,.75,.25,1) .05s forwards;
  }
  .wordmark{
    font-family:ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
                "Helvetica Neue", system-ui, sans-serif;
    font-weight:800;
    font-size:clamp(72px, 21vw, 96px);
    line-height:.9;
    letter-spacing:-1px;
    color:var(--white);
    opacity:0; transform:translateY(10px);
    animation:wordIn .9s cubic-bezier(.2,.75,.25,1) .22s forwards;
  }

  /* ── Loader : 4 pictos en vague ── */
  .loader{
    display:flex; align-items:center; gap:clamp(20px, 6vw, 30px);
    opacity:0;
    animation:fadeIn .6s ease .5s forwards;
  }
  .picto{
    width:36px; height:36px;
    color:var(--white);
    opacity:.34;
    transform:scale(1);
    animation:wave 1.8s ease-in-out infinite;
    will-change:opacity, transform;
  }
  .picto svg{ width:100%; height:100%; display:block; }
  .picto:nth-child(1){ animation-delay:0s; }
  .picto:nth-child(2){ animation-delay:.22s; }
  .picto:nth-child(3){ animation-delay:.44s; }
  .picto:nth-child(4){ animation-delay:.66s; }

  @keyframes wave{
    0%, 70%, 100%{ opacity:.34; transform:scale(1); }
    16%{ opacity:1; transform:scale(1.18); }
    34%{ opacity:.34; transform:scale(1); }
  }
  @keyframes logoIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes wordIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ to{ opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    .logo, .wordmark, .loader{ animation-duration:.01ms; }
    .picto{ animation:none; opacity:.9; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage" role="img" aria-label="FLO — chargement de l'inventaire du quartier">
    <div class="brand">
      <img class="logo" src="icons/logo-white.png" alt="FLO">
      <div class="wordmark">FLO</div>
    </div>

    <div class="loader" id="loader" aria-hidden="true">
      <!-- échelle -->
      <span class="picto"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3v22M19 3v22M9 8h10M9 14h10M9 20h10"/>
      </svg></span>
      <!-- scie -->
      <span class="picto"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12.5a3.5 3.5 0 0 1 3.5-3.5H9v7H5.5A3.5 3.5 0 0 1 2 12.5z"/><path d="M9 9.5H24l-1.6 4.5"/><path d="M9 14l1.5 2.4 1.5-2.4 1.5 2.4 1.5-2.4 1.5 2.4 1.5-2.4 1.5 2.4 1.4-2.2"/>
      </svg></span>
      <!-- clé -->
      <span class="picto"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 5.8a1 1 0 0 0 0 1.4l1.8 1.8a1 1 0 0 0 1.4 0l1.8-1.8a6.5 6.5 0 0 1-8.6 8.6l-7.5 7.5a2.3 2.3 0 0 1-3.2-3.2l7.5-7.5a6.5 6.5 0 0 1 8.6-8.6l-1.8 1.8z"/>
      </svg></span>
      <!-- poussette -->
      <span class="picto"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 4A9 9 0 0 0 4 13h9z"/><path d="M13 13l6-5"/><path d="M5.5 13l2.5 6.5M12 13l3 6.5"/><circle cx="8" cy="22" r="1.9"/><circle cx="15" cy="22" r="1.9"/>
      </svg></span>
    </div>
  </main>

  <script>
    setTimeout(function(){
      document.getElementById('stage').classList.add('out');
      setTimeout(function(){ window.location.href = 'index.html'; }, 460);
    }, 2700);
  </script>
</body>
</html>
