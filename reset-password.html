<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FLO">
  <meta name="theme-color" content="#ffffff">
  <title>FLO · Nouveau mot de passe</title>
  <style>
    :root {
      --bg:          #ffffff;
      --surface:     #ffffff;
      --surface-alt: #F7F7F5;
      --line:        rgba(60,60,67,0.12);
      --text:        #1A1A1C;
      --text-muted:  rgba(60,60,67,0.62);
      --text-dim:    rgba(60,60,67,0.38);
      --accent:      #1F9D55;
      --accent-ink:  #ffffff;
      --accent-soft: #E5EAE2;
      --danger:      #D9363E;
      --font: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
      --sat: env(safe-area-inset-top,    0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; background: var(--bg); }
    body { min-height: 100%; font-family: var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }

    #app { max-width: 430px; margin: 0 auto; height: 100dvh; overflow: hidden; position: relative; background: var(--bg); }
    .screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; }

    .login-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: max(40px, calc(var(--sat) + 28px)) 20px 120px;
      overscroll-behavior-y: contain;
    }

    .logo { text-align: center; margin-bottom: 24px; }
    .logo-name { color: var(--accent); font-size: 32px; font-weight: 700; line-height: 38px; letter-spacing: -0.4px; }
    .logo-street { color: var(--text-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.1px; margin-top: 4px; }

    .heading { text-align: center; margin-bottom: 36px; }
    .heading-title { font-size: 26px; font-weight: 700; line-height: 32px; letter-spacing: -0.3px; color: var(--text); margin-bottom: 6px; }
    .heading-sub { font-size: 15px; font-weight: 400; line-height: 20px; color: var(--text-muted); }

    .form-section { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.1px; margin-bottom: 7px; line-height: 14px; }
    .form-input {
      display: block; width: 100%; height: 50px;
      background: var(--surface-alt); border: 1px solid var(--line);
      border-radius: 14px; padding: 0 16px;
      font-family: var(--font); font-size: 16px; color: var(--text);
      outline: none; -webkit-appearance: none;
      transition: border-color .18s, background .18s;
    }
    .form-input:focus { border-color: var(--accent); background: var(--surface); }
    .form-input::placeholder { color: var(--text-dim); }
    .form-input.error { border-color: var(--danger); }

    .form-error {
      display: none; font-size: 13px; color: var(--danger);
      margin-top: 12px; line-height: 18px; text-align: center;
    }
    .form-success {
      display: none; font-size: 15px; color: var(--accent);
      margin-top: 12px; line-height: 22px; text-align: center;
      background: var(--accent-soft); border-radius: 12px; padding: 16px;
    }

    .login-cta {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 32px 20px calc(max(20px, var(--sab)) + 4px);
      background: linear-gradient(to top, var(--bg) 60%, transparent);
      pointer-events: none;
    }
    .cta-btn {
      pointer-events: auto; display: block; width: 100%; height: 54px;
      border-radius: 24px; border: none; background: var(--accent);
      color: var(--accent-ink); font-family: var(--font);
      font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
      cursor: pointer; -webkit-appearance: none; transition: opacity .15s;
    }
    .cta-btn:active { opacity: .82; }
    .cta-btn:disabled { opacity: .45; cursor: default; }

    #screen-loading { align-items: center; justify-content: center; }
    .spinner { width: 32px; height: 32px; border: 2.5px solid var(--surface-alt); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #screen-invalid { align-items: center; justify-content: center; padding: 32px; text-align: center; }
    .invalid-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .invalid-sub { font-size: 15px; color: var(--text-muted); line-height: 22px; margin-bottom: 32px; }
    .link-btn { color: var(--accent); font-size: 15px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<div id="app">

  <div class="screen" id="screen-loading">
    <div class="spinner"></div>
  </div>

  <div class="screen" id="screen-invalid" style="display:none;">
    <div class="invalid-title">Lien expiré</div>
    <div class="invalid-sub">Ce lien de réinitialisation n'est plus valide ou a déjà été utilisé.</div>
    <a href="login.html" class="link-btn">Retour à la connexion</a>
  </div>

  <div class="screen" id="screen-reset" style="display:none;">
    <div class="login-scroll">

      <div class="logo">
        <img src="icons/logo-192.png" style="width:64px; height:64px; border-radius:16px; display:block; margin:0 auto 12px;" alt="FLO">
        <div class="logo-name">FLO</div>
        <div class="logo-street">Front de Libération des Objets</div>
      </div>

      <div class="heading">
        <div class="heading-title">Nouveau mot de passe</div>
        <div class="heading-sub">Choisissez un nouveau mot de passe pour votre compte</div>
      </div>

      <div class="form-section">
        <div class="form-label">Nouveau mot de passe</div>
        <input class="form-input" id="f-password" type="password"
               autocomplete="new-password" placeholder="Minimum 6 caractères"
               onkeydown="if(event.key==='Enter'){event.preventDefault();resetPassword();}">
      </div>

      <div class="form-section">
        <div class="form-label">Confirmer le mot de passe</div>
        <input class="form-input" id="f-confirm" type="password"
               autocomplete="new-password" placeholder="Répétez le mot de passe"
               onkeydown="if(event.key==='Enter'){event.preventDefault();resetPassword();}">
      </div>

      <div class="form-error" id="reset-error"></div>
      <div class="form-success" id="reset-success">Mot de passe mis à jour ! Redirection…</div>

    </div>

    <div class="login-cta">
      <button class="cta-btn" id="reset-btn" onclick="resetPassword()">Enregistrer</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL      = 'https://optfcepolcjyregdaxpt.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdGZjZXBvbGNqeXJlZ2RheHB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzE1MjgsImV4cCI6MjA5MzU0NzUyOH0.ZvHOCyd8SQYzh7AQw4PexH742aFvPkeq1JKcLMaQytc'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true },
})

;(async () => {
  // Supabase envoie le token dans le hash : #access_token=...&type=recovery
  const hash = window.location.hash.substring(1)
  const params = Object.fromEntries(new URLSearchParams(hash))

  if (params.type === 'recovery' && params.access_token) {
    // Établit la session avec le token de recovery
    const { error } = await db.auth.setSession({
      access_token: params.access_token,
      refresh_token: params.refresh_token || '',
    })
    if (error) {
      showInvalid()
      return
    }
    showReset()
  } else {
    // Pas de token → lien invalide
    showInvalid()
  }
})()

function showInvalid() {
  document.getElementById('screen-loading').style.display = 'none'
  document.getElementById('screen-invalid').style.display = 'flex'
}

function showReset() {
  document.getElementById('screen-loading').style.display = 'none'
  document.getElementById('screen-reset').style.display   = 'flex'
}

async function resetPassword() {
  const pwd     = document.getElementById('f-password').value
  const confirm = document.getElementById('f-confirm').value
  const errEl   = document.getElementById('reset-error')
  const sucEl   = document.getElementById('reset-success')
  errEl.style.display = 'none'
  sucEl.style.display = 'none'
  document.getElementById('f-password').classList.remove('error')
  document.getElementById('f-confirm').classList.remove('error')

  if (pwd.length < 6) {
    errEl.textContent = 'Le mot de passe doit contenir au moins 6 caractères.'
    errEl.style.display = 'block'
    document.getElementById('f-password').classList.add('error')
    return
  }
  if (pwd !== confirm) {
    errEl.textContent = 'Les mots de passe ne correspondent pas.'
    errEl.style.display = 'block'
    document.getElementById('f-confirm').classList.add('error')
    return
  }

  const btn = document.getElementById('reset-btn')
  btn.disabled    = true
  btn.textContent = 'Enregistrement…'

  const { error } = await db.auth.updateUser({ password: pwd })

  btn.disabled    = false
  btn.textContent = 'Enregistrer'

  if (error) {
    errEl.textContent = 'Erreur : ' + error.message
    errEl.style.display = 'block'
    return
  }

  sucEl.style.display = 'block'
  setTimeout(() => { window.location.replace('index.html') }, 1500)
}
</script>
</body>
</html>
