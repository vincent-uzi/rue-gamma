<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>FLO · Connexion</title>
  <style>
    :root {
      --bg:          #ffffff;
      --surface:     #ffffff;
      --surface-alt: #F7F7F5;
      --line:        rgba(60,60,67,0.12);
      --text:        #1A1A1C;
      --text-muted:  rgba(60,60,67,0.62);
      --text-dim:    rgba(60,60,67,0.38);
      --accent:      #1F9D55;
      --accent-ink:  #ffffff;
      --accent-soft: #E5EAE2;
      --danger:      #D9363E;
      --font: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
      --sat: env(safe-area-inset-top,    0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; background: var(--bg); }
    body { min-height: 100%; font-family: var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }

    #app { max-width: 430px; margin: 0 auto; height: 100dvh; overflow: hidden; position: relative; background: var(--bg); }
    .screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; }

    .login-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: max(40px, calc(var(--sat) + 28px)) 20px 32px;
      overscroll-behavior-y: contain;
    }

    /* Logo */
    .logo { text-align: center; margin-bottom: 24px; }
    .logo-leaf {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--accent-soft); color: var(--accent);
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;
    }
    .logo-name { color: var(--accent); font-size: 32px; font-weight: 700; line-height: 38px; letter-spacing: -0.4px; }
    .logo-street { color: var(--text-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.1px; margin-top: 4px; }

    /* Heading */
    .heading { text-align: center; margin-bottom: 36px; }
    .heading-title { font-size: 26px; font-weight: 700; line-height: 32px; letter-spacing: -0.3px; color: var(--text); margin-bottom: 6px; }
    .heading-sub { font-size: 15px; font-weight: 400; line-height: 20px; color: var(--text-muted); }

    /* Form */
    .form-section { margin-bottom: 16px; }
    .form-label { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.1px; margin-bottom: 7px; line-height: 14px; }
    .form-input {
      display: block; width: 100%; height: 50px;
      background: var(--surface-alt); border: 1px solid var(--line);
      border-radius: 14px; padding: 0 16px;
      font-family: var(--font); font-size: 16px; color: var(--text);
      outline: none; -webkit-appearance: none;
      transition: border-color .18s, background .18s;
    }
    .form-input:focus { border-color: var(--accent); background: var(--surface); }
    .form-input::placeholder { color: var(--text-dim); }
    .form-input.error { border-color: var(--danger); }

    /* Error */
    .form-error {
      display: none; font-size: 13px; color: var(--danger);
      margin-top: 12px; line-height: 18px; text-align: center;
    }

    /* Join link */
    .join-link {
      text-align: center; margin-top: 24px;
      font-size: 14px; color: var(--text-muted); line-height: 20px;
    }
    .join-link a { color: var(--accent); text-decoration: none; font-weight: 500; }

    /* Sticky CTA */
    .login-cta {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 32px 20px calc(max(20px, var(--sab)) + 4px);
      background: linear-gradient(to top, var(--bg) 60%, transparent);
      pointer-events: none;
    }
    .cta-btn {
      pointer-events: auto; display: block; width: 100%; height: 54px;
      border-radius: 24px; border: none; background: var(--accent);
      color: var(--accent-ink); font-family: var(--font);
      font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
      cursor: pointer; -webkit-appearance: none; transition: opacity .15s;
    }
    .cta-btn:active { opacity: .82; }
    .cta-btn:disabled { opacity: .45; cursor: default; }

    /* Loading */
    #screen-loading { align-items: center; justify-content: center; }
    .spinner { width: 32px; height: 32px; border: 2.5px solid var(--surface-alt); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app">

  <div class="screen" id="screen-loading">
    <div class="spinner"></div>
  </div>

  <div class="screen" id="screen-login" style="display:none;">
    <div class="login-scroll">

      <div class="logo">
        <div class="logo-leaf" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 18 18" fill="none">
            <path d="M15 2.5C9 2.5 3 6 3 12c0 1.5.5 2.8 1.3 3.7C5.2 16.6 6.7 15.5 8 14c2.5-3 5-5 7-7-1 4-3.5 7-6 9"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-name">FLO</div>
        <div class="logo-street">Front de Libération des Objets</div>
      </div>

      <div class="form-section">
        <div class="form-label">Email</div>
        <input class="form-input" id="f-email" type="email"
               autocomplete="email" placeholder="marie@email.com"
               autocapitalize="none" autocorrect="off"
               onkeydown="if(event.key==='Enter'){event.preventDefault();login();}">
      </div>

      <div class="form-section">
        <div class="form-label">Mot de passe</div>
        <input class="form-input" id="f-password" type="password"
               autocomplete="current-password" placeholder="Votre mot de passe"
               onkeydown="if(event.key==='Enter'){event.preventDefault();login();}">
      </div>

      <div style="text-align:left;margin-top:8px;margin-bottom:16px;">
        <a href="#" onclick="alert('Fonctionnalité à venir');return false;" style="font-size:14px;color:#666;text-decoration:underline;">Mot de passe oublié ?</a>
      </div>

      <div class="form-error" id="login-error">Email ou mot de passe incorrect</div>

      <button class="cta-btn" id="login-btn" onclick="login()" style="margin-bottom:0;">Se connecter</button>

      <div style="margin-top:32px;background:#FFEAA7;border:1px solid #F5DC8E;border-radius:12px;padding:20px;text-align:center;">
        <p style="font-size:16px;color:#333;font-weight:600;margin:0 0 8px;">Première visite ?</p>
        <a href="signup.html" style="font-size:16px;color:#1F9D55;text-decoration:underline;font-weight:600;">Créez votre compte</a>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL      = 'https://optfcepolcjyregdaxpt.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdGZjZXBvbGNqeXJlZ2RheHB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzE1MjgsImV4cCI6MjA5MzU0NzUyOH0.ZvHOCyd8SQYzh7AQw4PexH742aFvPkeq1JKcLMaQytc'
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true },
})

// Si déjà connecté → index.html
;(async () => {
  const { data: { session } } = await db.auth.getSession()
  if (session) {
    window.location.replace('index.html')
    return
  }
  document.getElementById('screen-loading').style.display = 'none'
  document.getElementById('screen-login').style.display    = 'flex'
})()

async function login() {
  const email    = document.getElementById('f-email').value.trim()
  const password = document.getElementById('f-password').value
  const errEl    = document.getElementById('login-error')
  errEl.style.display = 'none'
  document.getElementById('f-email').classList.remove('error')
  document.getElementById('f-password').classList.remove('error')

  if (!email || !password) {
    if (!email)    document.getElementById('f-email').focus()
    else           document.getElementById('f-password').focus()
    return
  }

  const btn = document.getElementById('login-btn')
  btn.disabled    = true
  btn.textContent = 'Connexion…'

  const { data, error } = await db.auth.signInWithPassword({ email, password })

  btn.disabled    = false
  btn.textContent = 'Se connecter'

  if (error) {
    console.error('[login]', error)
    document.getElementById('f-email').classList.add('error')
    document.getElementById('f-password').classList.add('error')
    errEl.style.display = 'block'
    return
  }

  window.location.replace('index.html')
}
</script>
</body>
</html>
