<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Kolkoze · Rejoindre</title>
  <style>
    /* ── Design tokens · silentWhite ───────────────────────────── */
    :root {
      --bg:          #ffffff;
      --surface:     #ffffff;
      --surface-alt: #F7F7F5;
      --line:        rgba(60,60,67,0.12);
      --text:        #1A1A1C;
      --text-muted:  rgba(60,60,67,0.62);
      --text-dim:    rgba(60,60,67,0.38);
      --accent:      #1F9D55;
      --accent-ink:  #ffffff;
      --accent-soft: #E5EAE2;

      --font: -apple-system, 'SF Pro Text', 'SF Pro Display',
              'Helvetica Neue', system-ui, sans-serif;

      --sat: env(safe-area-inset-top,    0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html { height: 100%; background: var(--bg); }
    body {
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Typography ────────────────────────────────────────────── */
    .t-large-title { font-size: 32px; font-weight: 700; line-height: 38px; letter-spacing: -0.4px; }
    .t-title2      { font-size: 22px; font-weight: 700; line-height: 28px; letter-spacing: -0.2px; }
    .t-headline    { font-size: 16px; font-weight: 600; line-height: 21px; }
    .t-body        { font-size: 16px; font-weight: 400; line-height: 22px; }
    .t-caption     { font-size: 11px; font-weight: 500; line-height: 14px; letter-spacing: 0.1px; }

    /* ── Layout ────────────────────────────────────────────────── */
    #app {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .screen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ── Onboarding form screen ─────────────────────────────────── */
    .onb-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: max(60px, calc(var(--sat) + 48px)) 20px 140px;
      overscroll-behavior-y: contain;
    }

    .onb-logo {
      text-align: center;
      margin-bottom: 44px;
    }
    .onb-logo-leaf {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .onb-logo-name {
      color: var(--accent);
      font-size: 32px;
      font-weight: 700;
      line-height: 38px;
      letter-spacing: -0.4px;
    }
    .onb-logo-street {
      color: var(--text-muted);
      margin-top: 4px;
    }

    .onb-heading {
      text-align: center;
      margin-bottom: 36px;
    }
    .onb-heading-title {
      color: var(--text);
      margin-bottom: 8px;
    }
    .onb-heading-sub {
      color: var(--text-muted);
    }

    /* ── Form ───────────────────────────────────────────────────── */
    .form-section { margin-bottom: 20px; }
    .form-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.1px;
      margin-bottom: 8px;
      line-height: 14px;
    }
    .form-input {
      display: block;
      width: 100%;
      height: 50px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 16px;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      transition: border-color .18s, background .18s;
    }
    .form-input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }
    .form-input::placeholder { color: var(--text-dim); }

    /* ── Sticky CTA ─────────────────────────────────────────────── */
    .onb-cta {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 40px 20px calc(max(20px, var(--sab)) + 4px);
      background: linear-gradient(to top, var(--bg) 58%, transparent);
      pointer-events: none;
    }
    .cta-btn {
      pointer-events: auto;
      display: block;
      width: 100%;
      height: 54px;
      border-radius: 16px;
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      -webkit-appearance: none;
      transition: opacity .15s;
    }
    .cta-btn:active { opacity: .82; }

    /* ── Confirmation screen ────────────────────────────────────── */
    .confirm-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px calc(max(40px, var(--sab)) + 20px);
      text-align: center;
    }
    .confirm-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }
    .confirm-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 32px;
      margin-bottom: 12px;
    }
    .confirm-sub {
      font-size: 16px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 22px;
      margin-bottom: 44px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Écran formulaire ──────────────────────────────────────── -->
  <div class="screen" id="screen-form">

    <div class="onb-scroll">

      <!-- Logo -->
      <div class="onb-logo">
        <div class="onb-logo-leaf" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 18 18" fill="none">
            <path d="M15 2.5C9 2.5 3 6 3 12c0 1.5.5 2.8 1.3 3.7C5.2 16.6 6.7 15.5 8 14c2.5-3 5-5 7-7-1 4-3.5 7-6 9"
                  stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="onb-logo-name">Kolkoze</div>
        <div class="t-caption onb-logo-street">Rue Charles-Saint-Venant</div>
      </div>

      <!-- Heading -->
      <div class="onb-heading">
        <h1 class="t-title2 onb-heading-title">Bienvenue sur Kolkoze</h1>
        <p class="t-body onb-heading-sub">Rejoignez vos voisins et partagez vos objets</p>
      </div>

      <!-- Formulaire -->
      <form id="onb-form" onsubmit="handleSubmit(event)" novalidate>

        <div class="form-section">
          <div class="form-label">Prénom</div>
          <input class="form-input" id="f-prenom" type="text"
                 required autocomplete="given-name"
                 placeholder="Marie"
                 autocorrect="off" spellcheck="false">
        </div>

        <div class="form-section">
          <div class="form-label">Nom</div>
          <input class="form-input" id="f-nom" type="text"
                 required autocomplete="family-name"
                 placeholder="Dupont"
                 autocorrect="off" spellcheck="false">
        </div>

        <div class="form-section">
          <div class="form-label">Adresse — numéro + rue</div>
          <input class="form-input" id="f-adresse" type="text"
                 required autocomplete="street-address"
                 placeholder="12 rue Charles-Saint-Venant"
                 autocorrect="off" spellcheck="false">
        </div>

        <div class="form-section">
          <div class="form-label">Email</div>
          <input class="form-input" id="f-email" type="email"
                 required autocomplete="email"
                 placeholder="marie@email.com"
                 autocapitalize="none" autocorrect="off">
        </div>

      </form>

    </div><!-- /.onb-scroll -->

    <div class="onb-cta">
      <button class="cta-btn" onclick="trySubmit()">Rejoindre la communauté</button>
    </div>

  </div><!-- /#screen-form -->

  <!-- ── Écran confirmation ────────────────────────────────────── -->
  <div class="screen" id="screen-confirm" style="display:none;">

    <div class="confirm-body">
      <div class="confirm-icon" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 18 18" fill="none">
          <path d="M15 2.5C9 2.5 3 6 3 12c0 1.5.5 2.8 1.3 3.7C5.2 16.6 6.7 15.5 8 14c2.5-3 5-5 7-7-1 4-3.5 7-6 9"
                stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="confirm-title" id="confirm-title">Bienvenue !</h2>
      <p class="confirm-sub">Vous faites maintenant partie de la<br>Rue Charles-Saint-Venant</p>
      <button class="cta-btn" onclick="window.location.href='index.html'">Découvrir Kolkoze</button>
    </div>

  </div><!-- /#screen-confirm -->

</div><!-- /#app -->

<script>
function trySubmit() {
  const form = document.getElementById('onb-form');
  const inputs = form.querySelectorAll('input[required]');
  let valid = true;
  inputs.forEach(input => {
    if (!input.value.trim() || (input.type === 'email' && !input.value.includes('@'))) {
      if (valid) input.focus();
      valid = false;
    }
  });
  if (!valid) return;
  const prenom = document.getElementById('f-prenom').value.trim();
  document.getElementById('confirm-title').textContent = 'Bienvenue ' + prenom + ' !';
  document.getElementById('screen-form').style.display = 'none';
  const confirm = document.getElementById('screen-confirm');
  confirm.style.display = 'flex';
}

function handleSubmit(e) {
  e.preventDefault();
  trySubmit();
}
</script>
</body>
</html>
